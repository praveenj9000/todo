name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write placeholder env
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder" >> .env

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
